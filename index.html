<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PPIS Academic Coordinator</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 24px; max-width: 720px; margin: 0 auto; }
      button { padding: 12px 16px; margin-right: 8px; }
      #status { margin-top: 12px; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>PPIS Academic Coordinator</h1>
    <p>Tap Start, allow microphone access, then speak.</p>

    <button id="start">Start</button>
    <button id="stop">Stop</button>

    <div id="status">Status: idle</div>

    <script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/dist/vapi.js"></script>
    <script>
      const VAPI_PUBLIC_KEY = "PASTE_PUBLIC_KEY_HERE";
      const ASSISTANT_ID = "b86a3d49-85cf-49db-b14f-3afe627c494c";

      const statusEl = document.getElementById("status");
      const vapi = new Vapi(VAPI_PUBLIC_KEY);

      document.getElementById("start").onclick = async () => {
        statusEl.textContent = "Status: connecting...";
        try {
          await vapi.start(ASSISTANT_ID);
        } catch (e) {
          console.error(e);
          statusEl.textContent = "Status: error (check console)";
        }
      };

      document.getElementById("stop").onclick = () => vapi.stop();

      vapi.on("call-start", () => statusEl.textContent = "Status: in call");
      vapi.on("call-end", () => statusEl.textContent = "Status: ended");
      vapi.on("error", (e) => {
        console.error(e);
        statusEl.textContent = "Status: error (check console)";
      });
    </script>
  </body>
</html>
